<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Title -->
  <text x="400" y="55" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="url(#accent)" text-anchor="middle">OpenClaw × MiniMax 升级全记录</text>

  <!-- Subtitle -->
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="13" fill="#8892b0" text-anchor="middle">从月之暗面切换到 MiniMax · 2026.2.3-1 → 2026.5.6</text>

  <!-- Divider -->
  <rect x="100" y="96" width="600" height="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Left column: Before -->
  <text x="200" y="128" font-family="Arial Black, sans-serif" font-size="14" fill="#ff6b6b" text-anchor="middle">❌ 升级前</text>

  <text x="200" y="152" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">OpenClaw 2026.2.3-1</text>
  <text x="200" y="170" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">moonshot / kimi-k2.5</text>
  <text x="200" y="188" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">openai-completions API</text>
  <text x="200" y="206" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">余额按次扣费</text>
  <text x="200" y="224" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b" text-anchor="middle">✗ API 不稳定</text>
  <text x="200" y="238" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b" text-anchor="middle">✗ 费用不可预期</text>

  <!-- Arrow -->
  <path d="M 320 180 L 360 180 L 355 175 M 360 180 L 355 185" stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Right column: After -->
  <text x="520" y="128" font-family="Arial Black, sans-serif" font-size="14" fill="#00d4ff" text-anchor="middle">✅ 升级后</text>

  <text x="520" y="152" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">OpenClaw 2026.5.6</text>
  <text x="520" y="170" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">minimax / MiniMax-M2.7</text>
  <text x="520" y="188" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">anthropic-messages API</text>
  <text x="520" y="206" font-family="Consolas, monospace" font-size="11" fill="#e6e6e6" text-anchor="middle">与 Hermes / Claude Code 同源</text>
  <text x="520" y="224" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="middle">✓ API 稳定</text>
  <text x="520" y="238" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="middle">✓ 飞书正常连接</text>

  <!-- Divider 2 -->
  <rect x="100" y="262" width="600" height="1" fill="#ffffff10"/>

  <!-- Key fixes section -->
  <text x="400" y="286" font-family="Arial Black, sans-serif" font-size="12" fill="#f0f0f0" text-anchor="middle">🐛 问题与修复</text>

  <!-- Three bug boxes -->
  <g transform="translate(100, 298)">
    <rect x="0" y="0" width="180" height="72" rx="8" fill="#ffffff08" stroke="#ff6b6b40"/>
    <text x="90" y="18" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b" text-anchor="middle">Bug 1: npm 权限问题</text>
    <text x="90" y="34" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">--force 强制升级</text>
    <text x="90" y="48" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">--ignore-scripts</text>
    <text x="90" y="62" font-family="Consolas, monospace" font-size="9" fill="#00d4ff" text-anchor="middle">558 packages installed</text>
  </g>

  <g transform="translate(310, 298)">
    <rect x="0" y="0" width="180" height="72" rx="8" fill="#ffffff08" stroke="#ffd93d40"/>
    <text x="90" y="18" font-family="Arial, sans-serif" font-size="10" fill="#ffd93d" text-anchor="middle">Bug 2: API 类型错误</text>
    <text x="90" y="34" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">openai-completions</text>
    <text x="90" y="48" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">→ anthropic-messages</text>
    <text x="90" y="62" font-family="Consolas, monospace" font-size="9" fill="#00d4ff" text-anchor="middle">MiniMax 是 Anthropic 兼容</text>
  </g>

  <g transform="translate(520, 298)">
    <rect x="0" y="0" width="180" height="72" rx="8" fill="#ffffff08" stroke="#6bff6b40"/>
    <text x="90" y="18" font-family="Arial, sans-serif" font-size="10" fill="#6bff6b" text-anchor="middle">Bug 3: 飞书插件</text>
    <text x="90" y="34" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">feishu 需重新配对</text>
    <text x="90" y="48" font-family="Arial, sans-serif" font-size="9" fill="#8892b0" text-anchor="middle">pairing approve</text>
    <text x="90" y="62" font-family="Consolas, monospace" font-size="9" fill="#00d4ff" text-anchor="middle">openclaw pairing approve</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="392" font-family="Arial, sans-serif" font-size="11" fill="#5a6a8a" text-anchor="middle">OpenClaw Gateway · ws://127.0.0.1:18789 · MiniMax-M2.7 · Feishu OK</text>
</svg>
