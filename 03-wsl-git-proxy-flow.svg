<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="bgb3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2027"/><stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06d6a0"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="16" fill="url(#bgb3)"/>
  <text x="400" y="38" font-family="Arial" font-size="19" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Git 三级代理自动 Fallback 决策图</text>

  <!-- Start node -->
  <ellipse cx="400" cy="78" rx="72" ry="28" fill="#0f3460" stroke="#4cc9f0" stroke-width="2.5"/>
  <text x="400" y="74" font-family="Arial" font-size="12" fill="#4cc9f0" text-anchor="middle" font-weight="bold">~$ git xxx</text>
  <text x="400" y="90" font-family="Arial" font-size="10" fill="#a0e4ec" text-anchor="middle">执行 git 命令</text>

  <!-- Arrow to Q1 -->
  <line x1="400" y1="106" x2="400" y2="142" stroke="#06d6a0" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Q1: ghproxy reachable? -->
  <rect x="260" y="142" width="280" height="50" rx="12" fill="#1e3a5f" stroke="#ffd166" stroke-width="2"/>
  <text x="400" y="160" font-family="Arial" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">curl -x Clash 检测 ghproxy.com 可达？</text>
  <text x="400" y="178" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">通过 Clash 测试 ghproxy.com 是否响应</text>

  <!-- YES branch (left) -->
  <line x1="260" y1="167" x2="60" y2="167" stroke="#52b788" stroke-width="2"/>
  <line x1="60" y1="167" x2="60" y2="248" stroke="#52b788" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="120" y="160" font-family="Arial" font-size="11" fill="#52b788" text-anchor="middle">是</text>
  <rect x="5" y="248" width="155" height="80" rx="12" fill="#1b4332" stroke="#52b788" stroke-width="2.5"/>
  <text x="82" y="276" font-family="Arial" font-size="13" fill="#52b788" text-anchor="middle" font-weight="bold">级1：ghproxy</text>
  <text x="82" y="296" font-family="Arial" font-size="10" fill="#95d5b2" text-anchor="middle">git url.rewrite</text>
  <text x="82" y="312" font-family="Courier New" font-size="10" fill="#95d5b2" text-anchor="middle">→ ghproxy.com/github</text>
  <text x="82" y="328" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">Clash 关时走镜像</text>

  <!-- NO branch (right of Q1) -->
  <line x1="540" y1="167" x2="640" y2="167" stroke="#ef476f" stroke-width="2"/>
  <line x1="640" y1="167" x2="640" y2="248" stroke="#ef476f" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="600" y="159" font-family="Arial" font-size="11" fill="#ef476f" text-anchor="middle">否</text>

  <!-- Q2: Clash online? -->
  <rect x="540" y="248" width="200" height="50" rx="12" fill="#1e3a5f" stroke="#ffd166" stroke-width="2"/>
  <text x="640" y="266" font-family="Arial" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">Clash 在线？</text>
  <text x="640" y="284" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">curl -x 172.29.112.1:7890</text>

  <!-- Q2 YES (right) -->
  <line x1="740" y1="273" x2="770" y2="273" stroke="#52b788" stroke-width="2"/>
  <line x1="770" y1="273" x2="770" y2="360" stroke="#52b788" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="720" y="265" font-family="Arial" font-size="11" fill="#52b788" text-anchor="middle">是</text>
  <rect x="695" y="360" width="150" height="70" rx="12" fill="#1b4332" stroke="#06d6a0" stroke-width="2.5"/>
  <text x="770" y="388" font-family="Arial" font-size="13" fill="#06d6a0" text-anchor="middle" font-weight="bold">级2：Clash 代理</text>
  <text x="770" y="408" font-family="Courier New" font-size="10" fill="#90e0ef" text-anchor="middle">172.29.112.1:7890</text>
  <text x="770" y="423" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">HTTPS_PROXY 环境变量</text>

  <!-- Q2 NO (down) -->
  <line x1="640" y1="298" x2="640" y2="360" stroke="#ef476f" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="622" y="334" font-family="Arial" font-size="11" fill="#ef476f" text-anchor="middle">否</text>
  <rect x="565" y="360" width="150" height="70" rx="12" fill="#4a1942" stroke="#f72585" stroke-width="2.5"/>
  <text x="640" y="388" font-family="Arial" font-size="13" fill="#f72585" text-anchor="middle" font-weight="bold">级3：直连</text>
  <text x="640" y="408" font-family="Arial" font-size="10" fill="#f5a8d1" text-anchor="middle">unset 所有 proxy</text>
  <text x="640" y="423" font-family="Courier New" font-size="10" fill="#f5a8d1" text-anchor="middle">git clone https://...</text>

  <!-- Warning badge -->
  <rect x="200" y="385" width="300" height="36" rx="10" fill="#2d1b1b" stroke="#ef476f" stroke-width="1.5"/>
  <text x="350" y="408" font-family="Arial" font-size="11" fill="#ef476f" text-anchor="middle">⚠ 网络封禁443端口时：Clash 关 → 三级全挂</text>
</svg>