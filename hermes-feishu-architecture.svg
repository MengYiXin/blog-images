<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="background:#0f0c29">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Hermes × 飞书 双向通信架构</text>

  <!-- Feishu (left) -->
  <rect x="30" y="150" width="130" height="80" rx="8" fill="#1e3a5f" stroke="#4da6ff" stroke-width="2"/>
  <text x="95" y="175" font-family="Arial,sans-serif" font-size="13" fill="#4da6ff" text-anchor="middle">飞书</text>
  <text x="95" y="195" font-family="Arial,sans-serif" font-size="11" fill="#8ec8ff" text-anchor="middle">WeChat Feishu</text>
  <text x="95" y="215" font-family="Arial,sans-serif" font-size="10" fill="#4da6ff" text-anchor="middle">🇨🇳</text>

  <!-- WebSocket arrow: Feishu → Gateway -->
  <line x1="160" y1="190" x2="255" y2="190" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207" y="182" font-family="Arial,sans-serif" font-size="9" fill="#00d4ff" text-anchor="middle">WebSocket</text>
  <text x="207" y="210" font-family="Arial,sans-serif" font-size="9" fill="#888888" text-anchor="middle">wss://...</text>

  <!-- Hermes Gateway (center) -->
  <rect x="260" y="130" width="200" height="140" rx="8" fill="#1a2e1a" stroke="#00cc66" stroke-width="2"/>
  <text x="360" y="160" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#00cc66" text-anchor="middle">Hermes Gateway</text>
  <text x="360" y="178" font-family="Arial,sans-serif" font-size="10" fill="#88ffaa" text-anchor="middle">tmux: hermes-gateway</text>
  <text x="360" y="196" font-family="Arial,sans-serif" font-size="10" fill="#88ffaa" text-anchor="middle">PID: 4039 (systemd)</text>
  <text x="360" y="214" font-family="Arial,sans-serif" font-size="10" fill="#88ffaa" text-anchor="middle">Port: WebSocket only</text>
  <text x="360" y="232" font-family="Arial,sans-serif" font-size="10" fill="#00cc66" text-anchor="middle">✓ feishu connected</text>

  <!-- Hermes Agent (right) -->
  <rect x="560" y="150" width="150" height="80" rx="8" fill="#2a1a3a" stroke="#aa77ff" stroke-width="2"/>
  <text x="635" y="175" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#aa77ff" text-anchor="middle">Hermes Agent</text>
  <text x="635" y="195" font-family="Arial,sans-serif" font-size="10" fill="#cc99ff" text-anchor="middle">MiniMax-M2.7</text>
  <text x="635" y="213" font-family="Arial,sans-serif" font-size="10" fill="#aa77ff" text-anchor="middle">v0.12.0</text>

  <!-- API arrow: Gateway → Agent -->
  <line x1="460" y1="190" x2="555" y2="190" stroke="#aa77ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="507" y="180" font-family="Arial,sans-serif" font-size="9" fill="#aa77ff" text-anchor="middle">API</text>
  <text x="507" y="205" font-family="Arial,sans-serif" font-size="9" fill="#888888" text-anchor="middle">MiniMax</text>

  <!-- Return arrow: Agent → Gateway (HTTP) -->
  <path d="M560,240 L560,280 L360,280 L360,270" stroke="#ff9944" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="460" y="295" font-family="Arial,sans-serif" font-size="9" fill="#ff9944" text-anchor="middle">响应 / 推送结果</text>

  <!-- Return arrow: Gateway → Feishu -->
  <path d="M260,240 L260,280 L160,280 L160,210" stroke="#ff9944" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="210" y="295" font-family="Arial,sans-serif" font-size="9" fill="#ff9944" text-anchor="middle">HTTP POST</text>

  <!-- Startup chain (bottom) -->
  <rect x="30" y="380" width="840" height="100" rx="8" fill="#0d1117" stroke="#333333" stroke-width="1"/>
  <text x="450" y="400" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#cccccc" text-anchor="middle">开机自启链路</text>

  <!-- Chain nodes -->
  <rect x="50" y="412" width="110" height="40" rx="6" fill="#1a1a2e" stroke="#4da6ff" stroke-width="1.5"/>
  <text x="105" y="430" font-family="Arial,sans-serif" font-size="9" fill="#4da6ff" text-anchor="middle">Windows</text>
  <text x="105" y="444" font-family="Arial,sans-serif" font-size="9" fill="#4da6ff" text-anchor="middle">Startup</text>

  <line x1="160" y1="432" x2="195" y2="432" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="412" width="110" height="40" rx="6" fill="#1a1a2e" stroke="#00cc66" stroke-width="1.5"/>
  <text x="255" y="430" font-family="Arial,sans-serif" font-size="9" fill="#00cc66" text-anchor="middle">WSL tmux</text>
  <text x="255" y="444" font-family="Arial,sans-serif" font-size="9" fill="#00cc66" text-anchor="middle">hermes-gateway</text>

  <line x1="310" y1="432" x2="345" y2="432" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="350" y="412" width="130" height="40" rx="6" fill="#1a1a2e" stroke="#aa77ff" stroke-width="1.5"/>
  <text x="415" y="430" font-family="Arial,sans-serif" font-size="9" fill="#aa77ff" text-anchor="middle">hermes gateway run</text>
  <text x="415" y="444" font-family="Arial,sans-serif" font-size="9" fill="#aa77ff" text-anchor="middle">systemd managed</text>

  <line x1="480" y1="432" x2="515" y2="432" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="412" width="120" height="40" rx="6" fill="#1a1a2e" stroke="#ff9944" stroke-width="1.5"/>
  <text x="580" y="430" font-family="Arial,sans-serif" font-size="9" fill="#ff9944" text-anchor="middle">Feishu WebSocket</text>
  <text x="580" y="444" font-family="Arial,sans-serif" font-size="9" fill="#ff9944" text-anchor="middle">wss://msg-frontier</text>

  <line x1="640" y1="432" x2="675" y2="432" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="680" y="412" width="100" height="40" rx="6" fill="#1a1a2e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="730" y="430" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">✅ 就绪</text>
  <text x="730" y="444" font-family="Arial,sans-serif" font-size="9" fill="#88ff88" text-anchor="middle">双向通信正常</text>

  <!-- Legend -->
  <circle cx="820" cy="160" r="5" fill="#00d4ff"/>
  <text x="830" y="164" font-family="Arial,sans-serif" font-size="8" fill="#00d4ff">消息入口</text>
  <circle cx="820" cy="180" r="5" fill="#ff9944"/>
  <text x="830" y="184" font-family="Arial,sans-serif" font-size="8" fill="#ff9944">响应出口</text>
  <circle cx="820" cy="200" r="5" fill="#aa77ff"/>
  <text x="830" y="204" font-family="Arial,sans-serif" font-size="8" fill="#aa77ff">AI 推理</text>
</svg>
