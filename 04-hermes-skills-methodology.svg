<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bgb4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06d6a0"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="16" fill="url(#bgb4)"/>

  <!-- 标题 -->
  <text x="450" y="38" font-family="Arial" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Skill 创作五步法 — 从需求到自动化</text>

  <!-- ======== Step 1 命名 ======== -->
  <rect x="20" y="65" width="155" height="330" rx="12" fill="#1a1a2e" stroke="#4361ee" stroke-width="2.5"/>
  <rect x="20" y="65" width="155" height="38" rx="12" fill="#4361ee"/>
  <rect x="20" y="87" width="155" height="16" fill="#4361ee"/>
  <text x="97" y="90" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Step 1 命名</text>

  <text x="97" y="125" font-family="Arial" font-size="11" fill="#a0a8d8" text-anchor="middle">数字前缀排序</text>
  <rect x="35" y="140" width="125" height="24" rx="5" fill="#252540"/>
  <text x="97" y="157" font-family="Courier New" font-size="10" fill="#7b8cde" text-anchor="middle">01-hermes-install</text>

  <text x="97" y="195" font-family="Arial" font-size="11" fill="#a0a8d8" text-anchor="middle">英文 slug 格式</text>
  <text x="97" y="218" font-family="Arial" font-size="11" fill="#a0a8d8" text-anchor="middle">用动词开头</text>
  <text x="97" y="241" font-family="Arial" font-size="11" fill="#a0a8d8" text-anchor="middle">简短易记</text>
  <text x="97" y="264" font-family="Arial" font-size="11" fill="#a0a8d8" text-anchor="middle">示例：git-proxy-heal</text>

  <!-- arrow 1→2 -->
  <line x1="175" y1="230" x2="208" y2="230" stroke="#06d6a0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ======== Step 2 触发词 ======== -->
  <rect x="218" y="65" width="155" height="330" rx="12" fill="#1a1a2e" stroke="#7209b7" stroke-width="2.5"/>
  <rect x="218" y="65" width="155" height="38" rx="12" fill="#7209b7"/>
  <rect x="218" y="87" width="155" height="16" fill="#7209b7"/>
  <text x="295" y="90" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Step 2 触发词</text>

  <text x="295" y="125" font-family="Arial" font-size="11" fill="#c77dff" text-anchor="middle">覆盖正常场景</text>
  <rect x="233" y="136" width="125" height="22" rx="4" fill="#252540"/>
  <text x="295" y="152" font-family="Courier New" font-size="9" fill="#9d4edd" text-anchor="middle">"install hermes"</text>

  <text x="295" y="188" font-family="Arial" font-size="11" fill="#c77dff" text-anchor="middle">覆盖错误场景</text>
  <rect x="233" y="199" width="125" height="22" rx="4" fill="#252540"/>
  <text x="295" y="215" font-family="Courier New" font-size="9" fill="#9d4edd" text-anchor="middle">"hermes broken"</text>

  <text x="295" y="251" font-family="Arial" font-size="11" fill="#c77dff" text-anchor="middle">多个触发词组合</text>
  <rect x="233" y="262" width="125" height="22" rx="4" fill="#252540"/>
  <text x="295" y="278" font-family="Courier New" font-size="9" fill="#9d4edd" text-anchor="middle">"git连不上"</text>
  <text x="295" y="310" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">包含同义表达</text>

  <!-- arrow 2→3 -->
  <line x1="373" y1="230" x2="408" y2="230" stroke="#06d6a0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ======== Step 3 内容编写 ======== -->
  <rect x="418" y="65" width="155" height="330" rx="12" fill="#1a1a2e" stroke="#f72585" stroke-width="2.5"/>
  <rect x="418" y="65" width="155" height="38" rx="12" fill="#f72585"/>
  <rect x="418" y="87" width="155" height="16" fill="#f72585"/>
  <text x="495" y="90" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Step 3 编写内容</text>

  <text x="495" y="125" font-family="Arial" font-size="11" fill="#f5a8d1" text-anchor="middle">前置条件检查</text>
  <rect x="433" y="136" width="125" height="22" rx="4" fill="#252540"/>
  <text x="495" y="152" font-family="Courier New" font-size="9" fill="#f72585" text-anchor="middle">uv --version</text>

  <text x="495" y="188" font-family="Arial" font-size="11" fill="#f5a8d1" text-anchor="middle">核心步骤 + 验证</text>
  <rect x="433" y="199" width="125" height="22" rx="4" fill="#252540"/>
  <text x="495" y="215" font-family="Courier New" font-size="9" fill="#f72585" text-anchor="middle">curl ... &amp;&amp; OK</text>

  <text x="495" y="251" font-family="Arial" font-size="11" fill="#f5a8d1" text-anchor="middle">常见问题处理</text>
  <rect x="433" y="262" width="125" height="22" rx="4" fill="#252540"/>
  <text x="495" y="278" font-family="Courier New" font-size="9" fill="#f72585" text-anchor="middle">traps &amp; pitfalls</text>

  <text x="495" y="315" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">陷阱要提前写明</text>

  <!-- arrow 3→4 -->
  <line x1="573" y1="230" x2="608" y2="230" stroke="#06d6a0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ======== Step 4 测试 ======== -->
  <rect x="618" y="65" width="155" height="330" rx="12" fill="#1a1a2e" stroke="#06d6a0" stroke-width="2.5"/>
  <rect x="618" y="65" width="155" height="38" rx="12" fill="#06d6a0"/>
  <rect x="618" y="87" width="155" height="16" fill="#06d6a0"/>
  <text x="695" y="90" font-family="Arial" font-size="13" fill="#0f0c29" text-anchor="middle" font-weight="bold">Step 4 测试</text>

  <text x="695" y="125" font-family="Arial" font-size="11" fill="#90e0ef" text-anchor="middle">用触发词激活</text>
  <rect x="633" y="136" width="125" height="22" rx="4" fill="#252540"/>
  <text x="695" y="152" font-family="Courier New" font-size="9" fill="#06d6a0" text-anchor="middle">skill_view(name)</text>

  <text x="695" y="188" font-family="Arial" font-size="11" fill="#90e0ef" text-anchor="middle">完整执行一遍</text>
  <text x="695" y="211" font-family="Arial" font-size="11" fill="#90e0ef" text-anchor="middle">完整流程跑通</text>
  <text x="695" y="244" font-family="Arial" font-size="11" fill="#90e0ef" text-anchor="middle">修复发现的问题</text>
  <rect x="633" y="255" width="125" height="22" rx="4" fill="#252540"/>
  <text x="695" y="271" font-family="Courier New" font-size="9" fill="#06d6a0" text-anchor="middle">iterate → patch</text>

  <!-- arrow 4→5 -->
  <line x1="773" y1="230" x2="835" y2="230" stroke="#06d6a0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ======== Step 5 发布（右下角汇总箭头指向） ======== -->
  <rect x="788" y="155" width="100" height="150" rx="12" fill="#1a1a2e" stroke="#ffd166" stroke-width="2.5"/>
  <rect x="788" y="155" width="100" height="36" rx="12" fill="#ffd166"/>
  <rect x="788" y="175" width="100" height="16" fill="#ffd166"/>
  <text x="838" y="178" font-family="Arial" font-size="12" fill="#0f0c29" text-anchor="middle" font-weight="bold">Step 5</text>
  <text x="838" y="178" font-family="Arial" font-size="12" fill="#0f0c29" text-anchor="middle" font-weight="bold">发布</text>

  <text x="838" y="215" font-family="Arial" font-size="9" fill="#ffe8a3" text-anchor="middle">git push</text>
  <text x="838" y="232" font-family="Arial" font-size="9" fill="#ffe8a3" text-anchor="middle">~/.hermes/</text>
  <text x="838" y="249" font-family="Arial" font-size="9" fill="#ffe8a3" text-anchor="middle">skills/</text>
  <text x="838" y="276" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">更新</text>
  <text x="838" y="292" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">记忆文件</text>

  <!-- ======== 底部设计原则框 ======== -->
  <rect x="20" y="410" width="860" height="85" rx="12" fill="#1a1a2e" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="450" y="434" font-family="Arial" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">设计原则</text>
  <line x1="30" y1="442" x2="870" y2="442" stroke="#4a4a6a" stroke-width="0.8"/>

  <rect x="60" y="452" width="150" height="30" rx="6" fill="#4361ee" fill-opacity="0.25"/>
  <text x="135" y="471" font-family="Arial" font-size="11" fill="#7b8cde" text-anchor="middle">触发词要具体，覆盖正误场景</text>

  <rect x="240" y="452" width="150" height="30" rx="6" fill="#7209b7" fill-opacity="0.25"/>
  <text x="315" y="471" font-family="Arial" font-size="11" fill="#c77dff" text-anchor="middle">坑要提前说明，防患于未然</text>

  <rect x="420" y="452" width="150" height="30" rx="6" fill="#f72585" fill-opacity="0.25"/>
  <text x="495" y="471" font-family="Arial" font-size="11" fill="#f5a8d1" text-anchor="middle">条件分支覆盖要全，逻辑清晰</text>

  <rect x="600" y="452" width="150" height="30" rx="6" fill="#06d6a0" fill-opacity="0.25"/>
  <text x="675" y="471" font-family="Arial" font-size="11" fill="#90e0ef" text-anchor="middle">迭代靠 patch，测试靠实践</text>

  <rect x="780" y="452" width="80" height="30" rx="6" fill="#ffd166" fill-opacity="0.25"/>
  <text x="820" y="471" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">记忆更新</text>
</svg>
