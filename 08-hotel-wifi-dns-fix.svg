<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06d6a0"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef476f"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06d6a0"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="36" font-family="Arial" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">酒店WiFi DNS污染导致GitHub访问失败</text>
  <text x="400" y="58" font-family="Arial" font-size="13" fill="#a0e4ec" text-anchor="middle">改DNS为114.114后全通，无需代理</text>

  <!-- Hotel WiFi Router -->
  <rect x="20" y="100" width="120" height="90" rx="10" fill="#1e3a5f" stroke="#ffd166" stroke-width="2.5"/>
  <text x="80" y="130" font-family="Arial" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">酒店WiFi</text>
  <text x="80" y="148" font-family="Courier New" font-size="11" fill="#ef476f" text-anchor="middle">DNS: 31.1.x.x</text>
  <text x="80" y="165" font-family="Arial" font-size="10" fill="#ffb3ba" text-anchor="middle">⚠ 被污染</text>

  <!-- X mark on router -->
  <line x1="30" y1="108" x2="55" y2="133" stroke="#ef476f" stroke-width="2.5"/>
  <line x1="55" y1="108" x2="30" y2="133" stroke="#ef476f" stroke-width="2.5"/>

  <!-- DNS Poisoned - Left path -->
  <line x1="140" y1="145" x2="220" y2="145" stroke="#ef476f" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="180" y="138" font-family="Arial" font-size="11" fill="#ef476f" text-anchor="middle">DNS查询</text>

  <!-- DNS Server Box (Poisoned) -->
  <rect x="220" y="105" width="130" height="80" rx="10" fill="#3d1a1a" stroke="#ef476f" stroke-width="2"/>
  <text x="285" y="130" font-family="Arial" font-size="12" fill="#ef476f" text-anchor="middle" font-weight="bold">DNS服务器</text>
  <text x="285" y="150" font-family="Courier New" font-size="10" fill="#ffb3ba" text-anchor="middle">31.1.x.x</text>
  <text x="285" y="168" font-family="Arial" font-size="10" fill="#ff6b6b" text-anchor="middle">返回错误IP</text>

  <!-- Wrong path to GitHub -->
  <line x1="350" y1="145" x2="430" y2="145" stroke="#ef476f" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="390" y="138" font-family="Arial" font-size="11" fill="#ef476f" text-anchor="middle">错误IP</text>

  <!-- GitHub FAIL -->
  <rect x="430" y="105" width="120" height="80" rx="10" fill="#3d1a1a" stroke="#ef476f" stroke-width="2"/>
  <text x="490" y="135" font-family="Arial" font-size="14" fill="#ef476f" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="490" y="158" font-family="Arial" font-size="20" fill="#ef476f" text-anchor="middle">❌</text>
  <text x="490" y="175" font-family="Arial" font-size="10" fill="#ff6b6b" text-anchor="middle">连接超时</text>

  <!-- VS -->
  <text x="400" y="230" font-family="Arial" font-size="28" fill="#ffd166" text-anchor="middle" font-weight="bold">VS</text>

  <!-- Good DNS path -->
  <!-- DNS Box (Clean) -->
  <rect x="220" y="250" width="130" height="80" rx="10" fill="#1b4332" stroke="#06d6a0" stroke-width="2"/>
  <text x="285" y="275" font-family="Arial" font-size="12" fill="#06d6a0" text-anchor="middle" font-weight="bold">DNS服务器</text>
  <text x="285" y="295" font-family="Courier New" font-size="10" fill="#95d5b2" text-anchor="middle">114.114.114.114</text>
  <text x="285" y="313" font-family="Arial" font-size="10" fill="#52b788" text-anchor="middle">✅ 干净解析</text>

  <!-- Router to DNS -->
  <line x1="140" y1="250" x2="220" y2="290" stroke="#06d6a0" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="165" y="278" font-family="Arial" font-size="11" fill="#06d6a0" text-anchor="middle">DNS查询</text>

  <!-- DNS to GitHub OK -->
  <line x1="350" y1="290" x2="430" y2="290" stroke="#06d6a0" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="390" y="283" font-family="Arial" font-size="11" fill="#06d6a0" text-anchor="middle">正确IP</text>

  <!-- GitHub OK -->
  <rect x="430" y="250" width="120" height="80" rx="10" fill="#1b4332" stroke="#06d6a0" stroke-width="2"/>
  <text x="490" y="280" font-family="Arial" font-size="14" fill="#06d6a0" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="490" y="303" font-family="Arial" font-size="20" fill="#06d6a0" text-anchor="middle">✅</text>
  <text x="490" y="320" font-family="Arial" font-size="10" fill="#52b788" text-anchor="middle">访问正常</text>

  <!-- Bottom summary boxes -->
  <!-- Left: broken -->
  <rect x="50" y="380" width="280" height="80" rx="12" fill="#3d1a1a" stroke="#ef476f" stroke-width="2"/>
  <text x="190" y="408" font-family="Arial" font-size="13" fill="#ef476f" text-anchor="middle" font-weight="bold">❌ 现象：GitHub 打不开</text>
  <text x="190" y="428" font-family="Arial" font-size="11" fill="#ffb3ba" text-anchor="middle">ping 通但 curl 超时</text>
  <text x="190" y="448" font-family="Arial" font-size="11" fill="#ffb3ba" text-anchor="middle">华住 portal 也跳不出来</text>

  <!-- Arrow -->
  <line x1="330" y1="420" x2="380" y2="420" stroke="#ffd166" stroke-width="3" marker-end="url(#arr)"/>
  <text x="355" y="408" font-family="Arial" font-size="11" fill="#ffd166" text-anchor="middle">改DNS</text>

  <!-- Right: fixed -->
  <rect x="380" y="380" width="280" height="80" rx="12" fill="#1b4332" stroke="#06d6a0" stroke-width="2"/>
  <text x="520" y="408" font-family="Arial" font-size="13" fill="#06d6a0" text-anchor="middle" font-weight="bold">✅ 解决：DNS改114.114</text>
  <text x="520" y="428" font-family="Arial" font-size="11" fill="#95d5b2" text-anchor="middle">GitHub 直连正常</text>
  <text x="520" y="448" font-family="Arial" font-size="11" fill="#95d5b2" text-anchor="middle">无需开代理</text>

  <!-- Key insight -->
  <rect x="20" y="470" width="760" height="8" rx="4" fill="#ffd166" opacity="0.3"/>
</svg>
