  <!-- education-data-analysis -->
  <rect x="690" y="70" width="170" height="90" rx="10" fill="#3d405b" stroke="#ffd166" stroke-width="2"/>
  <text x="775" y="100" font-family="Arial" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">education-data</text>
  <text x="775" y="120" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">跨省高校对比分析</text>
  <text x="775" y="136" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">软科排名 · 录取分数</text>
