<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="520" rx="16" fill="url(#bg1)"/>
  <text x="450" y="42" font-family="Arial" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Hermes Agent Skills 生态全景图</text>

  <!-- center -->
  <circle cx="450" cy="230" r="60" fill="#0f3460" stroke="#e94560" stroke-width="3" filter="url(#glow)"/>
  <text x="450" y="222" font-family="Arial" font-size="13" fill="#e94560" text-anchor="middle" font-weight="bold">Hermes Agent</text>
  <text x="450" y="240" font-family="Arial" font-size="11" fill="#e94560" text-anchor="middle">v0.12.0 · WSL2</text>

  <!-- blog-deployer -->
  <rect x="40" y="70" width="170" height="90" rx="10" fill="#1e5f74" stroke="#4cc9f0" stroke-width="2"/>
  <text x="125" y="100" font-family="Arial" font-size="12" fill="#4cc9f0" text-anchor="middle" font-weight="bold">blog-deployer</text>
  <text x="125" y="120" font-family="Arial" font-size="10" fill="#a0e4ec" text-anchor="middle">Hexo → GitHub Pages</text>
