  <text x="125" y="152" font-family="Arial" font-size="10" fill="#ef476f" text-anchor="middle">⚠ 英文 slug 文件名</text>
  <line x1="210" y1="115" x2="388" y2="195" stroke="#4cc9f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="210" cy="115" r="4" fill="#4cc9f0"/>

  <!-- git-proxy-heal -->
  <rect x="40" y="210" width="170" height="90" rx="10" fill="#1b4332" stroke="#52b788" stroke-width="2"/>
  <text x="125" y="240" font-family="Arial" font-size="12" fill="#52b788" text-anchor="middle" font-weight="bold">git-proxy-heal</text>
  <text x="125" y="260" font-family="Arial" font-size="10" fill="#95d5b2" text-anchor="middle">WSL Git 代理自愈</text>
  <text x="125" y="276" font-family="Arial" font-size="10" fill="#95d5b2" text-anchor="middle">三级自动 Fallback</text>
  <text x="125" y="292" font-family="Arial" font-size="10" fill="#ffe8a3" text-anchor="middle">Clash/ghproxy/直连</text>
  <line x1="210" y1="255" x2="388" y2="235" stroke="#52b788" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="210" cy="255" r="4" fill="#52b788"/>

  <!-- session-backup -->
  <rect x="40" y="350" width="170" height="90" rx="10" fill="#4a1942" stroke="#f72585" stroke-width="2"/>
  <text x="125" y="380" font-family="Arial" font-size="12" fill="#f72585" text-anchor="middle" font-weight="bold">session-backup</text>
  <text x="125" y="400" font-family="Arial" font-size="10" fill="#f5a8d1" text-anchor="middle">Session 备份轮询</text>
