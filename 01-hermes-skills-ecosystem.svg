  <!-- Version -->
  <rect x="370" y="420" width="160" height="30" rx="8" fill="#0f3460" stroke="#4361ee" stroke-width="1.5"/>
  <text x="450" y="440" font-family="Arial" font-size="11" fill="#4361ee" text-anchor="middle">2026-05 · mengyx.com.cn</text>
