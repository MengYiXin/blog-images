  <text x="775" y="240" font-family="Arial" font-size="12" fill="#90e0ef" text-anchor="middle" font-weight="bold">gstack</text>
  <text x="775" y="260" font-family="Arial" font-size="10" fill="#caf0f8" text-anchor="middle">Headless Chromium</text>
  <text x="775" y="276" font-family="Arial" font-size="10" fill="#caf0f8" text-anchor="middle">WSL --no-sandbox</text>
  <text x="775" y="292" font-family="Arial" font-size="10" fill="#06d6a0" text-anchor="middle">✅ 已内置自动修复</text>
  <line x1="690" y1="255" x2="512" y2="235" stroke="#90e0ef" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="690" cy="255" r="4" fill="#90e0ef"/>

  <!-- memory -->
  <rect x="690" y="350" width="170" height="90" rx="10" fill="#1a1a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="775" y="380" font-family="Arial" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="bold">记忆系统</text>
  <text x="775" y="400" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">yixin · 华鲲振宇</text>
  <text x="775" y="416" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">副业变现 · AI工具</text>
  <text x="775" y="432" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">WSL2 + F盘存储</text>
  <line x1="690" y1="395" x2="512" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
